<!doctype html>
<meta charset="utf-8">
<title>Camera Edge</title>
<style>
  /* ---------------------------------------------------------------------
     Standalone camera border, in the same language as the Live Listen tiles:
     a thin yellow outline, a soft inner glow, and heavier corner brackets.

     Sized to nothing of its own - the browser source is created at exactly
     the camera's visible rect, so `inset: 0` IS the camera edge. That keeps
     the geometry in one place (the OBS transform) instead of duplicating
     measurements here.

     ?r=24    corner radius, px. The In Game camera is masked with rounded
              corners, so a square border would float off the video at the
              corners. Pass 0 for a hard-cornered tile.
     ?arm=26  bracket arm length
     ?t=2     bracket thickness
     --------------------------------------------------------------------- */
  :root { --accent: #f4e409; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  #edge {
    position: absolute; inset: 0;
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
      inset 0 0 60px color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .br { position: absolute; background: var(--accent); }
</style>

<div id="edge"></div>

<script>
  const p = new URLSearchParams(location.search);
  const R = Number(p.get('r')  ?? 24);
  const A = Number(p.get('arm') ?? 26);
  const T = Number(p.get('t')  ?? 2);

  document.getElementById('edge').style.borderRadius = R + 'px';

  /* ?accent=ff4d94 pins this source's colour; without it, the per-show
     theme accent applies live over SSE like the big overlays. */
  const PIN = p.get('accent');
  if (PIN) document.documentElement.style.setProperty('--accent',
    '#' + PIN.replace('#', ''));
  function applyTheme(s) {
    if (PIN) return;
    const t = (s.themes || {})[s.show] || {};
    const root = document.documentElement.style;
    if (t.accent) root.setProperty('--accent', t.accent);
    else root.removeProperty('--accent');
  }
  fetch('/state').then(r => r.json()).then(applyTheme).catch(() => {});
  let es = null;
  function connect() {
    es = new EventSource('/events');
    es.onmessage = (e) => { try { applyTheme(JSON.parse(e.data)); } catch (_) {} };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
  window.addEventListener('pagehide', () => { try { if (es) es.close(); } catch (_) {} });

  /* Arms start where the arc ends, so they sit on the straight run of each
     edge rather than cutting the corner off. */
  const edge = document.getElementById('edge');
  for (const [vy, vx] of [['top', 'left'], ['top', 'right'],
                          ['bottom', 'left'], ['bottom', 'right']]) {
    const h = document.createElement('i');   // arm along the horizontal edge
    h.className = 'br';
    h.style[vy] = '0'; h.style[vx] = R + 'px';
    h.style.width = A + 'px'; h.style.height = T + 'px';
    edge.appendChild(h);

    const v = document.createElement('i');   // arm along the vertical edge
    v.className = 'br';
    v.style[vx] = '0'; v.style[vy] = R + 'px';
    v.style.height = A + 'px'; v.style.width = T + 'px';
    edge.appendChild(v);
  }
</script>
