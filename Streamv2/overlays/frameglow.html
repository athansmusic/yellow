<!doctype html>
<meta charset="utf-8">
<title>Frame Glow</title>
<style>
  /* ---------------------------------------------------------------------
     A yellow border around the whole canvas with a highlight travelling
     slowly around it. Built for how Twitch actually renders a stream:

     - THICKNESS. The browse grid draws roughly 320x180, a 6x downscale from
       1920x1080. A 2px border lands on a third of a pixel and turns into
       shimmer or disappears. 10px here survives as a readable ~1.7px line.

     - CHEAP MOTION. The border itself never changes; only a soft gradient
       sweeps along it. A chasing dash pattern is high-frequency detail
       changing every frame, which is close to worst case for NVENC and takes
       bitrate straight off the face. A slow low-contrast sweep costs almost
       nothing.

     ?w=10   border thickness in px
     ?s=12   seconds per full lap
     ?a=0.5  base border alpha (the static part)
     --------------------------------------------------------------------- */
  :root { --accent: #f4e409; --w: 10px; }

  html, body {
    margin: 0; width: 1920px; height: 1080px;
    overflow: hidden; position: relative; background: transparent;
  }

  /* The constant part. --base-a is the ?a= knob, themable accent underneath. */
  :root { --base-a: 50%; }
  #base {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 var(--w)
      color-mix(in srgb, var(--accent) var(--base-a), transparent);
  }

  /* The moving part, clipped to the border ring: two masks, with the inner
     rectangle excluded, leaves exactly the frame. The mask clips descendants,
     which is what confines the spinner below. */
  #ring {
    position: absolute; inset: 0;
    padding: var(--w); box-sizing: border-box; overflow: hidden;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }

  /* Square and oversized so the cone always covers the 1920x1080 diagonal. */
  #spin {
    position: absolute; left: 50%; top: 50%;
    width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
    /* Highlight = accent pushed toward white, so it tracks any theme colour
       while still reading as a light moving along the border. */
    background: conic-gradient(from 0deg,
      transparent 0deg,
      transparent 250deg,
      color-mix(in srgb, color-mix(in srgb, var(--accent) 55%, white) 55%, transparent) 310deg,
      color-mix(in srgb, color-mix(in srgb, var(--accent) 25%, white) 95%, transparent) 340deg,
      color-mix(in srgb, color-mix(in srgb, var(--accent) 55%, white) 55%, transparent) 350deg,
      transparent 360deg);
    animation: lap var(--s, 12s) linear infinite;
  }

  @keyframes lap { to { transform: rotate(360deg); } }
</style>

<div id="base"></div>
<div id="ring"><div id="spin"></div></div>

<script>
  const p = new URLSearchParams(location.search);
  const w = Number(p.get('w') || 10);
  const s = Number(p.get('s') || 12);
  const a = p.get('a');

  const r = document.documentElement.style;
  r.setProperty('--w', w + 'px');
  r.setProperty('--s', s + 's');
  if (a !== null) r.setProperty('--base-a', (Number(a) * 100) + '%');

  /* ?accent=ff4d94 pins this source's colour; without it, the per-show
     theme accent applies live over SSE like the big overlays. */
  const PIN = p.get('accent');
  if (PIN) r.setProperty('--accent', '#' + PIN.replace('#', ''));
  function applyTheme(st) {
    if (PIN) return;
    const t = (st.themes || {})[st.show] || {};
    if (t.accent) r.setProperty('--accent', t.accent);
    else r.removeProperty('--accent');
  }
  fetch('/state').then(x => x.json()).then(applyTheme).catch(() => {});
  let es = null;
  function connect() {
    es = new EventSource('/events');
    es.onmessage = (e) => { try { applyTheme(JSON.parse(e.data)); } catch (_) {} };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
  window.addEventListener('pagehide', () => { try { if (es) es.close(); } catch (_) {} });
</script>
