<!doctype html>
<meta charset="utf-8">
<title>Sub Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* ---------------------------------------------------------------------
     Per-stream sub goal. The bar fills with the show's brush stroke - each
     sub draws more of the redaction, goal complete = fully redacted.

     Count comes from the same credits store the end screen uses (per
     stream, gifters credited with their count, cleared at go-live), so
     this can never disagree with the credits roll.

     Designed at 480x120; the browser source's box is the layout.
     ?goal=5 overrides the state's subGoal for this source only.
     --------------------------------------------------------------------- */
  :root {
    --accent:  #f4e409;
    --display: #f7f7f5;
    --meta:    #5c5c64;
    --edge:    #26262c;
    --panel:   #050506;
    --disp: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: var(--mono);
  }
  /* No panel slab. The track carries its own solid ground; the header
     floats with a shadow, same treatment as the broadcast footer. */
  #wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    gap: 6px; padding: 0 2px; box-sizing: border-box;
  }
  #head { text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #head { display: flex; align-items: baseline; gap: 12px; }
  #lbl {
    font-weight: 600; font-size: 12px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--accent);
  }
  #rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
  #num {
    font-family: var(--disp); font-weight: 700; font-size: 26px;
    letter-spacing: .04em; color: var(--display);
    font-variant-numeric: tabular-nums;
  }
  #num .of { color: var(--meta); font-size: 18px; }

  #track {
    position: relative; height: 34px;
    background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge);
  }
  /* The fill: accent yellow in the brush stroke's shape - the stroke is a
     MASK over the colour, because black ink on the near-black track was
     invisible. If the mask image fails to load the fill is a plain yellow
     bar, which still works. */
  #fill {
    position: absolute; inset: 3px;
    background: var(--accent);
    clip-path: inset(0 100% 0 0);
    transition: clip-path .6s cubic-bezier(.25,.8,.25,1);
    filter: drop-shadow(0 0 8px rgba(244,228,9,.12));
  }
  /* Ticks: one per sub of the goal, so progress is countable at a glance. */
  #ticks { position: absolute; inset: 0; display: flex; }
  #ticks i { flex: 1; border-right: 1px solid var(--edge); }
  #ticks i:last-child { border-right: none; }

  body.done #lbl { color: var(--display); }
  body.done #num, body.done #num .of { color: var(--accent); }
  body.done #track { box-shadow: inset 0 0 0 1px rgba(244,228,9,.6); }
  body.done #fill { animation: sg-pulse 2.2s ease-in-out infinite; }
  @keyframes sg-pulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(244,228,9,.15)); }
    50% { filter: drop-shadow(0 0 18px rgba(244,228,9,.45)); }
  }
</style>

<div id="wrap">
  <div id="head">
    <span id="lbl">sub goal</span>
    <span id="rule"></span>
    <span id="num"><span id="cur">0</span> <span class="of">/ <span id="tgt">5</span></span></span>
  </div>
  <div id="track">
    <div id="fill"></div>
    <div id="ticks"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);

  // The brush stroke as a mask over the yellow, sliced like the alert bars
  // so the ragged ends stay honest at any width. Only applied once the
  // image confirms loadable - a failed mask would hide the fill entirely,
  // whereas no mask is just a plain yellow bar.
  const BRUSH_URL = "/file?path=C:/Users/19407/Documents/Redacted/Script/Streamv2/media/redactedbar.png";
  const probe = new Image();
  probe.onload = () => {
    const f = document.getElementById('fill').style;
    f.webkitMaskBoxImageSource = "url('" + BRUSH_URL + "')";
    f.webkitMaskBoxImageSlice = "0 200 fill";
    f.webkitMaskBoxImageWidth = "0 24px";
    f.webkitMaskBoxImageRepeat = "stretch";
  };
  probe.src = BRUSH_URL;

  function subCount(credits) {
    // Same accounting as the credits roll: a gifter counts for every sub
    // they gave; everyone else (sub or resub) counts once.
    let n = 0;
    for (const r of ((credits || {}).subs || [])) n += r.gifted ? r.gifted : 1;
    return n;
  }

  let ticksBuilt = 0;
  function render(s) {
    const goal = Math.max(1, parseInt(params.get('goal') || s.subGoal || '5', 10) || 5);
    const cur = subCount(s.credits);

    document.getElementById('cur').textContent = cur;
    document.getElementById('tgt').textContent = goal;

    const frac = Math.min(1, cur / goal);
    document.getElementById('fill').style.clipPath =
      'inset(0 ' + ((1 - frac) * 100).toFixed(2) + '% 0 0)';

    if (ticksBuilt !== goal) {
      const box = document.getElementById('ticks');
      box.innerHTML = '';
      for (let i = 0; i < goal; i++) box.appendChild(document.createElement('i'));
      ticksBuilt = goal;
    }
    document.body.classList.toggle('done', cur >= goal);

    // Theme accent follows the active show, like the other overlays.
    const t = (s.themes || {})[s.show] || {};
    const root = document.documentElement.style;
    if (t.accent) root.setProperty('--accent', t.accent);
    else root.removeProperty('--accent');
  }

  // Retry until the first snapshot lands: a swallowed one-shot fetch left
  // the bar frozen at 0 until the next SSE event happened to arrive.
  function initialState() {
    fetch('/state').then(r => r.json()).then(render)
      .catch(() => setTimeout(initialState, 1500));
  }
  initialState();
  let es = null;
  function connect() {
    es = new EventSource('/events');
    es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
  window.addEventListener('pagehide', () => { try { if (es) es.close(); } catch (_) {} });
</script>
