<!--
  [REDACTED] raid alert - SIGNAL BREACH.

  Letterbox, fire, scanline flash, flickering breach warning, and the
  raider's name stamps in on the big bar. ~11.6s.

  FIREBOT SETUP
    Event:   Raid
    Effect:  Show HTML
    HTML:    paste this entire file
    Removal: 12 seconds
    The name uses Firebot's username variable. To put the raider count in
    the sub-label, use the dollar button - it lists this event's variables.

  THE FULL TAKEOVER (recommended): in the same Raid event, add an
  "HTTP Request" effect BEFORE this one -
      Method POST,  URL http://127.0.0.1:8722/effect/threshold
      Body (raw JSON): {"seconds": 12}
  The whole stream slams to black/yellow for the duration of the breach.
  It reverts by itself.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  .rk-raid {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    overflow: hidden;
    animation: rkr-exit .4s ease-in 11.2s forwards;
  }

  /* Cinematic letterbox: the broadcast snaps to widescreen for the
     duration of the breach. Sits over the fire; the centre
     stack is untouched. */
  .rk-raid .cine {
    position: absolute; left: 0; right: 0; height: 130px;
    background: #030304; z-index: 3;
  }
  .rk-raid .cine.top {
    top: 0; transform: translateY(-100%);
    animation: rkr-cinein .55s cubic-bezier(.25,.8,.25,1) .15s forwards,
               rkr-cineout-t .45s ease-in 10.7s forwards;
  }
  .rk-raid .cine.bot {
    bottom: 0; transform: translateY(100%);
    animation: rkr-cinein .55s cubic-bezier(.25,.8,.25,1) .15s forwards,
               rkr-cineout-b .45s ease-in 10.7s forwards;
  }

  /* Fire over everything but the text: luma-keyed webm, so the black is
     genuinely transparent and the scene stays visible through it. Served
     by the control server - if the server is down the video 404s and the
     rest of the alert plays fine without it. */
  .rk-raid .fire {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    animation: rkr-firein .8s ease .2s forwards,
               rkr-fireout 1.2s ease-in 9.8s forwards;
