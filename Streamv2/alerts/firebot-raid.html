  [REDACTED] raid alert - SIGNAL BREACH.

  Scanline flash, flickering breach warning, the raider's name stamps in
  on the big bar, and a crowd of small censor bars hits the screen behind
  it - the raiders, identities redacted. Bar positions randomize each
  play. ~11.6s.

  FIREBOT SETUP
    Event:   Raid
    Effect:  Show HTML
    HTML:    paste this entire file
    Removal: 12 seconds
    The name uses Firebot's username variable. To put the raider count in
    the sub-label, use the dollar button - it lists this event's variables.

  THE FULL TAKEOVER (recommended): in the same Raid event, add an
  "HTTP Request" effect BEFORE this one -
      Method POST,  URL http://127.0.0.1:8722/effect/threshold
      Body (raw JSON): {"seconds": 12}
  The whole stream slams to black/yellow for the duration of the breach.
  It reverts by itself.
-->

  .rk-raid .core {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px;
    animation: rkr-jolt 11s steps(1, end) 1;

    font-family: "IBM Plex Mono", Consolas, monospace;
    font-weight: 600; font-size: 15px; letter-spacing: .42em;
    text-indent: .42em; text-transform: uppercase; color: #f4e409;

    clip-path: inset(-8% 100% -8% -3%);
    animation: rkr-draw .5s cubic-bezier(.25,.8,.25,1) .9s both,
               rkr-undraw .4s ease-in 11s forwards;

  .rk-raid .name {
    position: relative; z-index: 1;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: .04em;
    text-transform: uppercase; color: #f7f7f5; white-space: nowrap;
    opacity: 0; animation: rkr-namein .3s ease 1.5s forwards,
                           rkr-fadeout .25s ease-in 10.95s forwards;
  }

  @keyframes rkr-static {
    0% { opacity: 0; } 3% { opacity: .55; } 6% { opacity: .12; }
    9% { opacity: .4; } 14% { opacity: .1; } 90% { opacity: .1; }
    100% { opacity: 0; }
  }
  @keyframes rkr-flicker { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: .25; } }
  @keyframes rkr-hold    { to { opacity: 1; } }
  @keyframes rkr-fadeout { to { opacity: 0; } }
  @keyframes rkr-draw    { to { clip-path: inset(-8% -3% -8% -3%); } }
  @keyframes rkr-undraw  { to { clip-path: inset(-8% -3% -8% 103%); } }
  @keyframes rkr-namein  { from { opacity: 0; transform: translateY(6px); }
                           to   { opacity: 1; transform: none; } }
  @keyframes rkr-ministamp { to { clip-path: inset(-10% -4% -10% -4%); } }
  @keyframes rkr-miniout   { to { opacity: 0; } }
  @keyframes rkr-exit    { to { opacity: 0; } }
  @keyframes rkr-jolt {
    0%, 13%, 16%, 34%, 37%, 58%, 61%, 100% { transform: none; }
    14% { transform: translateX(-4px) skewX(-1.2deg); }
    15% { transform: translateX(4px); }
    35% { transform: translateX(3px) skewX(.8deg); }
    36% { transform: translateX(-3px); }
    59% { transform: translateX(-3px); }
    60% { transform: translateX(2px); }
  }
</style>

<div class="rk-raid">
  <div class="static"></div>
  <div class="minis"></div>
  <div class="core">
    <div class="warn">intrusion detected</div>
    <div class="bar">
      <div class="brush"></div>
      <div class="name">$username</div>
    </div>
  </div>
</div>

<script>
  (function () {
    var name = document.querySelector('.rk-raid .name');

    // Standalone preview only - Firebot substitutes before render.
    if (name && name.textContent.indexOf('$') === 0) {
      name.textContent = 'BELLHOUSE_9';
      document.querySelector('.rk-raid').style.background = '#101013';
    }

    // Fit guard: any raider name lands inside the bar.
    var MAX_W = 640, FLOOR = 26;
    if (name && name.scrollWidth > MAX_W) {
      var size = Math.max(FLOOR, Math.floor(56 * MAX_W / name.scrollWidth));
      name.style.fontSize = size + 'px';
    }

    // The crowd: 11 anonymous bars stamp in at random spots, avoiding the
    // centre band where the raider's bar sits. New layout every raid.
    var box = document.querySelector('.rk-raid .minis');
    for (var i = 0; i < 11; i++) {
      var m = document.createElement('div');
      m.className = 'mini';
      var top = Math.random() < 0.5
        ? 3 + Math.random() * 25          // upper band
        : 72 + Math.random() * 22;        // lower band
      m.style.top = top + '%';
      m.style.left = (2 + Math.random() * 78) + '%';
      m.style.width = (110 + Math.random() * 150) + 'px';
      m.style.transform = 'rotate(' + (Math.random() * 6 - 3).toFixed(1) + 'deg)';
      var delay = (0.4 + Math.random() * 2.2).toFixed(2);
      m.style.animation = 'rkr-ministamp .3s cubic-bezier(.25,.8,.25,1) ' + delay + 's forwards, '
                        + 'rkr-miniout .4s ease-in ' + (9.9 + Math.random() * 0.9).toFixed(2) + 's forwards';
      box.appendChild(m);
    }
  })();
</script>
