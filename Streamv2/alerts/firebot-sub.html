  @keyframes rk-jolt {
    0%, 38%, 41%, 100% { transform: none; }
    39% { transform: translateX(-3px) skewX(-1deg); }
    40% { transform: translateX(3px); }

<div class="rk-alert">
  <div class="rk-stamp">
    <div class="rk-label">[ new subscriber ]</div>
    <div class="rk-bar">
      <div class="rk-brush"></div>
      <div class="rk-name">$username</div>
      <div class="rk-scan"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var name = document.querySelector('.rk-alert .rk-name');
    var label = document.querySelector('.rk-alert .rk-label');

    // Standalone preview only. In Firebot, the variables are substituted
    // before this ever renders, so this branch never fires there.
    if (name && name.textContent.indexOf('$') === 0) {
      name.textContent = 'HOLLOWCASTLE';
      label.textContent = '[ new subscriber ]';
      // Backdrop on the alert element ONLY - never document.body. This
      // script also runs inside Firebot's overlay if a variable comes
      // through unreplaced, and painting the body there blacks out the
      // whole overlay source until it reloads.
      document.querySelector('.rk-alert').style.background = '#101013';
    }

    // Fit guard, runs everywhere including Firebot: a marathon username
    // must land inside the stroke, not stretch it across the screen. Cap
    // the name's width and shrink the type to fit; the floor keeps even
    // absurd names legible.
    var MAX_W = 620, FLOOR = 26;
    if (name && name.scrollWidth > MAX_W) {
      var size = Math.max(FLOOR, Math.floor(48 * MAX_W / name.scrollWidth));
      name.style.fontSize = size + 'px';
    }
  })();
</script>
