<!--
  [REDACTED] sub alert - the redaction bar.

  A censor bar stamps across the screen, then the subscriber's name
  declassifies out of it: scanner line sweeps, name reveals, holds,
  re-redacts and collapses. ~5.6s total.

  FIREBOT SETUP
    Event:   Sub (and Resub, if wanted)
    Effect:  Show HTML
    HTML:    paste this entire file
    Removal: 6 seconds
    $username is Firebot's variable - it replaces it before rendering.

  Preview: open this file in a browser - it fills in a sample name and a
  dark backdrop by itself when Firebot hasn't substituted the variable.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  .rk-alert {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    animation: rk-exit .35s ease-in 5.25s forwards;
  }
  .rk-stamp {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: rk-jolt 4s steps(1, end) 1;
  }
  .rk-label {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-weight: 600; font-size: 13px; letter-spacing: .34em;
    text-transform: uppercase; color: #f4e409;
    opacity: 0; animation: rk-fade .3s ease .5s forwards;
  }
  .rk-bar {
    position: relative; padding: 20px 40px 23px; background: #050506;
    box-shadow: inset 0 0 0 1px rgba(244,228,9,.5), 0 0 46px rgba(244,228,9,.14);
    transform-origin: left center;
    animation: rk-draw .45s cubic-bezier(.22,.9,.28,1) both,
               rk-undraw .35s ease-in 5.15s forwards;
  }
  .rk-bar i {
    position: absolute; width: 16px; height: 16px; opacity: 0;
    animation: rk-fade .2s ease .55s forwards;
  }
  .rk-bar i.tl { top: -5px; left: -5px;  border-top: 2px solid #f4e409; border-left: 2px solid #f4e409; }
  .rk-bar i.tr { top: -5px; right: -5px; border-top: 2px solid #f4e409; border-right: 2px solid #f4e409; }
  .rk-bar i.bl { bottom: -5px; left: -5px;  border-bottom: 2px solid #f4e409; border-left: 2px solid #f4e409; }
  .rk-bar i.br { bottom: -5px; right: -5px; border-bottom: 2px solid #f4e409; border-right: 2px solid #f4e409; }
  .rk-name {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: .04em;
    text-transform: uppercase; color: #f7f7f5; white-space: nowrap;
    clip-path: inset(-12% 100% -12% 0);
    animation: rk-reveal .55s cubic-bezier(.3,.7,.2,1) .7s forwards,
               rk-rehide .3s ease-in 4.9s forwards;
  }
  .rk-scan {
    position: absolute; top: -8px; bottom: -8px; width: 3px; left: 0;
    background: #f4e409; box-shadow: 0 0 14px rgba(244,228,9,.8);
    opacity: 0;
    animation: rk-scanmove .55s cubic-bezier(.3,.7,.2,1) .7s,
               rk-scanmove .3s ease-in 4.9s;
  }

  @keyframes rk-draw    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rk-undraw  { from { transform-origin: right center; transform: scaleX(1); }
                          to   { transform-origin: right center; transform: scaleX(0); } }
  @keyframes rk-fade    { to { opacity: 1; } }
  @keyframes rk-reveal  { to { clip-path: inset(-12% -6% -12% 0); } }
  @keyframes rk-rehide  { to { clip-path: inset(-12% -6% -12% 106%); } }
  @keyframes rk-scanmove{ 0% { left: 2%; opacity: 1; } 99% { opacity: 1; }
                          100% { left: 97%; opacity: 0; } }
  @keyframes rk-exit    { to { opacity: 0; } }
  @keyframes rk-jolt {
    0%, 38%, 41%, 100% { transform: none; }
    39% { transform: translateX(-3px) skewX(-1deg); }
    40% { transform: translateX(3px); }
  }
</style>

<div class="rk-alert">
  <div class="rk-stamp">
    <div class="rk-label">[ new subscriber ]</div>
    <div class="rk-bar">
      <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
      <div class="rk-name">$username</div>
      <div class="rk-scan"></div>
    </div>
  </div>
</div>

<script>
  // Standalone preview only. In Firebot, $username is substituted before
  // this ever renders, so none of this runs.
  (function () {
    var el = document.querySelector('.rk-alert .rk-name');
    if (el && el.textContent.indexOf('$') === 0) {
      el.textContent = 'HOLLOWCASTLE';
      document.body.style.background = '#101013';
    }
  })();
</script>
