<!--
  [REDACTED] gift-sub alert - the redaction bar.

  The show's actual brush-stroke bar (media/redactedbar.png, embedded)
  swipes across, then the name declassifies out of it: scanner sweep,
  reveal, one glitch jolt, hold, re-redact, wipe out. ~5.6s total.

  FIREBOT SETUP
    Event:   Community Subs Gifted (and/or Sub Gifted)
    Effect:  Show HTML
    HTML:    paste this entire file
    Removal: 6 seconds
    On gift events the username variable IS the gifter. Variable
    names are spelled without their dollar sign here because
    Firebot parses every dollar-word in this box, comments
    included: the name uses (dollar)username, the label uses
    (dollar)giftCount - the dollar button in this effect lists
    what each event offers if that one is missing.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  .rk-alert {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    animation: rk-exit .35s ease-in 5.25s forwards;
  }
  .rk-stamp {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    animation: rk-jolt 4s steps(1, end) 1;
  }
  .rk-label {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-weight: 600; font-size: 13px; letter-spacing: .34em;
    text-transform: uppercase; color: #f4e409;
    opacity: 0; animation: rk-fade .3s ease .55s forwards;
  }
  .rk-bar { position: relative; padding: 30px 70px 33px; }
  .rk-brush {
    position: absolute; inset: 0; z-index: 0;
    clip-path: inset(-8% 100% -8% -3%);
    animation: rk-draw .5s cubic-bezier(.25,.8,.25,1) both,
               rk-undraw .35s ease-in 5.15s forwards;
    filter: drop-shadow(0 0 34px rgba(244,228,9,.16));
  }
  .rk-brush img { width: 100%; height: 100%; display: block; }
  .rk-name {
    position: relative; z-index: 1;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: .04em;
    text-transform: uppercase; color: #f7f7f5; white-space: nowrap;
    clip-path: inset(-14% 100% -14% 0);
    animation: rk-reveal .55s cubic-bezier(.3,.7,.2,1) .75s forwards,
               rk-rehide .3s ease-in 4.9s forwards;
  }
  .rk-scan {
    position: absolute; top: 6px; bottom: 6px; width: 3px; left: 0; z-index: 2;
    background: #f4e409; box-shadow: 0 0 14px rgba(244,228,9,.8);
    opacity: 0;
    animation: rk-scanmove .55s cubic-bezier(.3,.7,.2,1) .75s,
               rk-scanmove .3s ease-in 4.9s;
  }

  @keyframes rk-draw    { to { clip-path: inset(-8% -3% -8% -3%); } }
  @keyframes rk-undraw  { to { clip-path: inset(-8% -3% -8% 103%); } }
  @keyframes rk-fade    { to { opacity: 1; } }
  @keyframes rk-reveal  { to { clip-path: inset(-14% -6% -14% 0); } }
  @keyframes rk-rehide  { to { clip-path: inset(-14% -6% -14% 106%); } }
  @keyframes rk-scanmove{ 0% { left: 4%; opacity: 1; } 99% { opacity: 1; }
                          100% { left: 95%; opacity: 0; } }
  @keyframes rk-exit    { to { opacity: 0; } }
  @keyframes rk-jolt {
    0%, 38%, 41%, 100% { transform: none; }
    39% { transform: translateX(-3px) skewX(-1deg); }
    40% { transform: translateX(3px); }
  }
</style>
